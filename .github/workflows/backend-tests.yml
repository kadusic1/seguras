name: backend-tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: seguras_test
          MYSQL_USER: test
          MYSQL_PASSWORD: test
          # Deliberately non-UTC: on a UTC session the TIMESTAMP roundtrip
          # is correct even without a pinned session timezone, so the
          # integration test could not detect a regression.
          TZ: Europe/Sarajevo
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Run tests against MariaDB
        working-directory: backend
        env:
          TEST_DB_DSN: test:test@tcp(127.0.0.1:3306)/seguras_test
        run: go test ./...
