services:
  mariadb:
    image: mariadb:lts
    container_name: mariadb-container
    restart: unless-stopped
    networks:
      - seguras-net
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?database root password not set}
      MARIADB_DATABASE: ${DB_NAME:-seguras_db}
      MARIADB_USER: ${DB_APP_USER:-seguras_app}
      MARIADB_PASSWORD: ${DB_APP_PASSWORD:?database app password not set}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    image: backend
    container_name: backend-container
    networks:
      - seguras-net
    env_file:
      - ./backend/.env
    environment:
      - DB_DSN=${DB_APP_USER}:${DB_APP_PASSWORD}@tcp(mariadb:3306)/${DB_NAME}
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: frontend
    container_name: frontend-container
    depends_on:
      - backend
    env_file:
      - ./frontend/.env
    environment:
      NODE_ENV: production
      PORT: "3000"
      AUTH_TRUST_HOST: "true"
      API_URL: http://backend:8080
    networks:
      - seguras-net
    ports:
      - "3000:3000"
    restart: unless-stopped

  ofelia:
    image: mcuadros/ofelia:latest
    container_name: ofelia-scheduler
    command: daemon --docker
    depends_on:
      backend:
        condition: service_started
      mariadb:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - seguras-net
    labels:
      ofelia.job-run.sweeper-task.schedule: "@daily"
      ofelia.job-run.sweeper-task.image: "backend"
      ofelia.job-run.sweeper-task.command: "/seguras-cron"
      ofelia.job-run.sweeper-task.network: "seguras-net"
      ofelia.job-run.sweeper-task.volume: "${PWD}/backend/.env:/.env:ro"
      ofelia.job-run.sweeper-task.environment: '["DB_DSN=${DB_APP_USER}:${DB_APP_PASSWORD}@tcp(mariadb:3306)/${DB_NAME}"]'
      ofelia.job-run.db-backup.schedule: "0 0 3 * * *"
      ofelia.job-run.db-backup.image: "mariadb:lts"
      ofelia.job-run.db-backup.network: "seguras-net"
      ofelia.job-run.db-backup.command: "/bin/sh /backup/backup.sh"
      ofelia.job-run.db-backup.no-overlap: "true"
      ofelia.job-run.db-backup.volume: '["${PWD}/backend/scripts/backup.sh:/backup/backup.sh:ro", "${PWD}/backups:/backups:rw"]'
      ofelia.job-run.db-backup.environment: '["MARIADB_ROOT_PASSWORD=${DB_ROOT_PASSWORD}", "MARIADB_DATABASE=${DB_NAME:-seguras_db}", "BACKUP_RETENTION_DAYS=14"]'
    restart: unless-stopped

volumes:
  mariadb_data:

networks:
  seguras-net:
    name: seguras-net
    driver: bridge
